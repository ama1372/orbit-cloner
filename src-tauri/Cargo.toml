[package]
name = "orbit-cloner"
version = "0.1.0"
description = "Portable Windows Electron profile manager"
edition = "2021"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winreg = "0.56"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
